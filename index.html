<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ketty vous guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="languageSplash" class="language-splash">
    <div class="language-panel">
      <img id="languageLogo" class="language-logo" src="images/logo-ot.png" alt="Autour du Palais idéal">
      <h1>Bienvenue ! <span>Hello!</span></h1>
      <p>Choisissez votre langue · Choose your language</p>
      <div class="language-buttons">
        <button data-lang="fr">🇫🇷 Français</button>
        <button data-lang="en">🇬🇧 English</button>
      </div>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="title-zone">
        <div id="title" class="main-title"></div>
        <div class="title-line"></div>
      </div>

      <div class="touch">
        <div class="finger">☝️</div>
        <div>
          <div id="instruction" class="touch-title"></div>
          <div id="sub" class="touch-sub"></div>
        </div>
      </div>

      <div class="logo-zone">
        <div id="languageSwitch" class="language-switch">
          <button data-lang="fr">FR</button>
          <button data-lang="en">EN</button>
        </div>
        <img id="officeLogo" class="office-logo" alt="">
      </div>
    </header>

    <main>
      <aside>
        <img id="ketty" class="ketty" alt="KettyBot">
        <div id="bubble" class="bubble"></div>
      </aside>
      <section id="cards" class="cards"></section>
    </main>

    <footer>
      <div class="brand">
        <span id="brandName"></span>
        <small id="brandSignature"></small>
      </div>
      <div id="footerText" class="footer-text"></div>
    </footer>
  </div>

  <button id="voiceSettingsBtn" class="voice-settings-btn" title="Réglages voix" aria-label="Réglages voix">⚙</button>

  <div id="voiceSettingsModal" class="voice-settings-modal hidden">
    <div class="voice-settings-box">
      <button id="closeVoiceSettings" class="close">×</button>
      <h2>Réglages de la voix</h2>

      <div class="voice-lang-section">
        <h3>🇫🇷 Voix française</h3>
        <label for="voiceSelectFr">Voix</label>
        <select id="voiceSelectFr"></select>
        <label for="rateRangeFr">Vitesse : <span id="rateValueFr">1.00</span></label>
        <input id="rateRangeFr" type="range" min="0.6" max="1.4" step="0.05" value="1">
        <label for="pitchRangeFr">Hauteur : <span id="pitchValueFr">1.00</span></label>
        <input id="pitchRangeFr" type="range" min="0.6" max="1.4" step="0.05" value="1">
        <button id="testVoiceFr" class="test-voice-btn">🔊 Tester la voix française</button>
      </div>
      <div class="voice-lang-section">
        <h3>🇬🇧 English voice</h3>
        <label for="voiceSelectEn">Voice</label>
        <select id="voiceSelectEn"></select>
        <label for="rateRangeEn">Speed: <span id="rateValueEn">1.00</span></label>
        <input id="rateRangeEn" type="range" min="0.6" max="1.4" step="0.05" value="1">
        <label for="pitchRangeEn">Pitch: <span id="pitchValueEn">1.00</span></label>
        <input id="pitchRangeEn" type="range" min="0.6" max="1.4" step="0.05" value="1">
        <button id="testVoiceEn" class="test-voice-btn">🔊 Test English voice</button>
      </div>
      <p class="voice-note">Ces réglages sont mémorisés sur cette tablette.</p>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="close" class="close">×</button>
      <div id="micon" class="micon"></div>
      <h2 id="mtitle"></h2>
      <p id="mmessage"></p>
      <div class="actions">
        <button id="replay"></button>
        <button id="go" class="go"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
