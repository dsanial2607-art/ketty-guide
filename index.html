<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ketty vous guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="title-zone">
        <div id="title" class="main-title"></div>
        <div class="title-line"></div>
      </div>

      <div class="touch">
        <div class="finger">☝️</div>
        <div>
          <div id="instruction" class="touch-title"></div>
          <div id="sub" class="touch-sub"></div>
        </div>
      </div>

      <div class="logo-zone">
        <img id="officeLogo" class="office-logo" alt="">
      </div>
    </header>

    <main>
      <aside>
        <img id="ketty" class="ketty" alt="KettyBot">
        <div id="bubble" class="bubble"></div>
      </aside>
      <section id="cards" class="cards"></section>
    </main>

    <footer>
      <div class="brand">
        <span id="brandName"></span>
        <small id="brandSignature"></small>
      </div>
      <div id="footerText" class="footer-text"></div>
    </footer>
  </div>

  <button id="voiceSettingsBtn" class="voice-settings-btn" title="Réglages voix" aria-label="Réglages voix">⚙</button>

  <div id="voiceSettingsModal" class="voice-settings-modal hidden">
    <div class="voice-settings-box">
      <button id="closeVoiceSettings" class="close">×</button>
      <h2>Réglages de la voix</h2>

      <label for="voiceSelect">Voix française</label>
      <select id="voiceSelect"></select>

      <label for="rateRange">Vitesse : <span id="rateValue">1.00</span></label>
      <input id="rateRange" type="range" min="0.6" max="1.4" step="0.05" value="1">

      <label for="pitchRange">Hauteur : <span id="pitchValue">1.00</span></label>
      <input id="pitchRange" type="range" min="0.6" max="1.4" step="0.05" value="1">

      <button id="testVoiceBtn" class="test-voice-btn">🔊 Tester la voix</button>
      <p class="voice-note">Ces réglages sont mémorisés sur cette tablette.</p>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="close" class="close">×</button>
      <div id="micon" class="micon"></div>
      <h2 id="mtitle"></h2>
      <p id="mmessage"></p>
      <div class="actions">
        <button id="replay"></button>
        <button id="go" class="go"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
